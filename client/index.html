<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidequest | Gamified Productivity</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>🎮 Sidequest</h1>
      <button id="logoutBtn" class="ghost hidden">Logout</button>
    </header>

    <main>
      <section id="authView" class="card">
        <div class="tabs">
          <button id="loginTab" class="tab active">Login</button>
          <button id="signupTab" class="tab">Sign Up</button>
        </div>

        <form id="loginForm" class="auth-form">
          <h2>Welcome Back</h2>
          <input type="email" id="loginEmail" placeholder="Email" required />
          <input type="password" id="loginPassword" placeholder="Password" required />
          <button type="submit">Login</button>
        </form>

        <form id="signupForm" class="auth-form hidden">
          <h2>Create Account</h2>
          <input type="text" id="signupUsername" placeholder="Username" required />
          <input type="email" id="signupEmail" placeholder="Email" required />
          <input type="password" id="signupPassword" placeholder="Password" minlength="6" required />
          <button type="submit">Sign Up</button>
        </form>

        <p id="authMessage" class="message"></p>
      </section>

      <section id="dashboardView" class="hidden">
        <div class="stats-grid">
          <article class="stat-card">
            <p class="label">Player</p>
            <h3 id="usernameText">-</h3>
          </article>
          <article class="stat-card">
            <p class="label">XP</p>
            <h3 id="xpText">0</h3>
          </article>
          <article class="stat-card">
            <p class="label">Level</p>
            <h3 id="levelText">1</h3>
          </article>
          <article class="stat-card">
            <p class="label">Streak</p>
            <h3 id="streakText">0 🔥</h3>
          </article>
        </div>

        <section class="card progress-card">
          <div class="progress-head">
            <h2>Level Progress</h2>
            <span id="progressText">0 / 100 XP</span>
          </div>
          <div class="progress-wrap">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </section>

        <section class="card controls">
          <button id="generateQuestBtn">Generate New Quest</button>
          <button id="seedQuestBtn" class="ghost">Load Daily Starter Quests</button>
          <div class="filters">
            <input id="searchInput" type="search" placeholder="Search quests..." />
            <select id="categoryFilter">
              <option>All</option>
              <option>Fitness</option>
              <option>Money</option>
              <option>Learning</option>
              <option>Social</option>
              <option>Fun</option>
              <option>Random</option>
            </select>
            <select id="difficultyFilter">
              <option>All</option>
              <option>Easy</option>
              <option>Medium</option>
              <option>Hard</option>
            </select>
          </div>
        </section>

        <section>
          <h2 class="section-title">Your Side Quests</h2>
          <div id="questList" class="quest-grid"></div>
        </section>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
